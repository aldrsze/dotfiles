;=============================================
; Polybar Config - Taskbar Style with System Metrics
;=============================================

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:size=9;2
font-1 = JetBrainsMono Nerd Font:size=12;3

modules-left = i3
modules-center = 
modules-right = cpu memory volume brightness network bluetooth ac-power battery date tray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[colors]
background = #0a0a0a
background-alt = #1a1a1a
foreground = #e0e0e0
primary = #ffffff
secondary = #b0b0b0
alert = #ff4444
disabled = #555555
blue = #e0e0e0
green = #e0e0e0
yellow = #e0e0e0
red = #ff4444
magenta = #e0e0e0
teal = #e0e0e0

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 2
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%
label-muted = "󰝟 muted"
label-muted-foreground = ${colors.disabled}

[module/brightness]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = "󰃛 "
format-prefix-foreground = ${colors.yellow}
label = %percentage%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.teal}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.magenta}
label = %percentage_used:2%%

[module/network]
type = custom/script
exec = ~/.config/polybar/network-latency.sh
interval = 5
format-prefix = "󰤨 "
format-prefix-foreground = ${colors.blue}
format-foreground = ${colors.foreground}

[module/bluetooth]
type = custom/script
exec = if ! bluetoothctl show | grep -q "Powered: yes"; then echo "󰂲 Off"; elif device=$(bluetoothctl info | grep "Name:" | head -1 | cut -d: -f2 | xargs) && [ -n "$device" ]; then echo "󰂯 $device"; else echo "󰂯 On"; fi
interval = 10
format-foreground = ${colors.foreground}

[module/ac-power]
type = custom/script
exec = if [ "$(cat /sys/class/power_supply/AC/online)" = "1" ]; then echo "󰂅 Plugged In"; else echo ""; fi
interval = 5
format-foreground = ${colors.green}

[module/battery]
type = custom/script
exec = if [ "$(cat /sys/class/power_supply/AC/online)" = "1" ]; then exit 1; else cap=$(cat /sys/class/power_supply/BAT0/capacity); echo "󰁹 ${cap}%"; fi
interval = 10
format-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1
date = %I:%M %p
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.yellow}
label = %date%
label-foreground = ${colors.foreground}

[module/tray]
type = internal/tray
tray-spacing = 4pt
tray-padding = 2
tray-background = ${colors.background}
