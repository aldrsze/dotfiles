;=============================================
; Polybar Config - Taskbar Style with System Metrics
;=============================================

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 15pt
background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 2
padding-right = 2

module-margin = 1

border-size = 0

separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:size=9;2
font-1 = JetBrainsMono Nerd Font:size=12;3

modules-left = i3
modules-center = date
;modules-right = cpu memory volume brightness network bluetooth ac-power battery tray
modules-right = volume bluetooth network ac-power battery

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[colors]
background = #0a0a0a
background-alt = #1a1a1a
foreground = #e0e0e0
accent = #ffffff
accent-fg = #0a0a0a
disabled = #555555
alert = #ff4444

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true

label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.accent-fg}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 2
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-font = 2
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%

label-muted = "󰝟 muted"
label-muted-foreground = ${colors.disabled}

;[module/brightness]
;type = internal/backlight
;card = intel_backlight
;use-actual-brightness = true
;enable-scroll = true
;format = <label>
;format-prefix = "󰃛 "
;format-prefix-foreground = ${colors.accent}
;label = %percentage%%

;[module/cpu]
;type = internal/cpu
;interval = 2
;format-prefix = "󰻠 "
;format-prefix-foreground = ${colors.accent}
;label = %percentage:2%%

;[module/memory]
;type = internal/memory
;interval = 2
;format-prefix = "󰍛 "
;format-prefix-foreground = ${colors.accent}
;label = %percentage_used:2%%

; Shows wifi icon with state: 󰤨 connected, 󰀦 no internet, 󰤭 disconnected
[module/network]
type = custom/script
exec = ~/.config/polybar/network-latency.sh
interval = 5
format-font = 1
format-foreground = ${colors.accent}

; Shows the bluetooth glyph only when a device is actually connected
; Shows bluetooth icon with state: 󰂱 connected, 󰂲 on but no device, 󰂜 off
[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 10
format-font = 2
format-foreground = ${colors.foreground}

[module/ac-power]
type = custom/script
exec = if [ "$(cat /sys/class/power_supply/AC/online)" = "1" ]; then echo "󰂅"; fi
interval = 5
format-font = 1
format-foreground = ${colors.accent}

[module/battery]
type = custom/script
exec = if [ "$(cat /sys/class/power_supply/AC/online)" = "1" ]; then exit 1; else cap=$(cat /sys/class/power_supply/BAT0/capacity); echo "󰁹 ${cap}%"; fi
interval = 10
format-font = 1
format-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1
date = "%a %I:%M %p"
date-alt = "%A, %B %d  %I:%M %p"
label = %date%
label-font = 1
label-foreground = ${colors.foreground}

;[module/tray]
;type = internal/tray
;tray-spacing = 4pt
;tray-padding = 2
;tray-background = ${colors.background}
